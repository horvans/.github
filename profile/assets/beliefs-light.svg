<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="290" viewBox="0 0 1280 290" role="img" aria-label="What we believe: technology should be a hand on the shoulder, not a wall; simple outlasts clever and honest outlasts loud; a better tomorrow is made, not found.">
<style>
  .e { stroke:#0B0F19; stroke-opacity:0.18; stroke-width:1.4; stroke-dasharray:260; stroke-dashoffset:0; animation: draw 1.6s cubic-bezier(.16,1,.3,1) backwards; }
  .n { animation: fade .6s ease-out backwards; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite 2s; opacity:0; }
  .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes draw { from { stroke-dashoffset:260; } }
  @keyframes fade { from { opacity:0; } }
  @keyframes rise { from { opacity:0; transform: translateY(10px); } }
  @keyframes pulse { 0% { opacity:.7; transform: scale(1); } 100% { opacity:0; transform: scale(4.2); } }
  @media (prefers-reduced-motion: reduce) { .e,.n,.rise,.pulse { animation:none; } }
</style>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><g class="rise" style="animation-delay:0.15s">
  <rect x="28" y="20" width="384" height="250" rx="18" fill="#F0EFEA" stroke="#0B0F19" stroke-opacity="0.18"/>
  <text x="60" y="78" font-size="15" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="2" fill="#E11D2E">01</text>
  <text x="60" y="124" font-size="30" font-weight="700" letter-spacing="-.5" fill="#0B0F19">A hand, not a wall</text>
  <text x="60" y="168" font-size="18" fill="#4B5263">Technology should feel like a</text><text x="60" y="196" font-size="18" fill="#4B5263">hand on the shoulder, never a</text><text x="60" y="224" font-size="18" fill="#4B5263">wall in the way.</text>
</g><g class="rise" style="animation-delay:0.33s">
  <rect x="436" y="20" width="384" height="250" rx="18" fill="#F0EFEA" stroke="#0B0F19" stroke-opacity="0.18"/>
  <text x="468" y="78" font-size="15" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="2" fill="#E11D2E">02</text>
  <text x="468" y="124" font-size="26" font-weight="700" letter-spacing="-.5" fill="#0B0F19">Simple outlasts clever</text>
  <text x="468" y="168" font-size="18" fill="#4B5263">Honest outlasts loud. The best</text><text x="468" y="196" font-size="18" fill="#4B5263">work is built to last, and</text><text x="468" y="224" font-size="18" fill="#4B5263">built to be shared.</text>
</g><g class="rise" style="animation-delay:0.51s">
  <rect x="844" y="20" width="384" height="250" rx="18" fill="#F0EFEA" stroke="#0B0F19" stroke-opacity="0.18"/>
  <text x="876" y="78" font-size="15" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="2" fill="#E11D2E">03</text>
  <text x="876" y="124" font-size="30" font-weight="700" letter-spacing="-.5" fill="#0B0F19">Made, not found</text>
  <text x="876" y="168" font-size="18" fill="#4B5263">A better tomorrow is not found.</text><text x="876" y="196" font-size="18" fill="#4B5263">It is made, quietly, one</text><text x="876" y="224" font-size="18" fill="#4B5263">careful line at a time.</text>
</g></g>
</svg>